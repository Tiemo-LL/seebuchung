name: CI

on:
  push:
  pull_request:

jobs:
  phpcs:
    name: phpcs (WPCS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - name: Composer install
        run: composer install --prefer-dist --no-progress
      - name: phpcs
        run: composer phpcs

  tests:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.4' ]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Composer install
        run: composer install --prefer-dist --no-progress
      - name: PHPUnit
        run: composer test
